name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'Li o CLA e concordo com os seus termos.'))
    steps:
      # Runs on pull_request_target with write access: never check out or run code from the PR.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Discipulu/discipulu/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: micahgomes,*[bot]
          custom-pr-sign-comment: Li o CLA e concordo com os seus termos.
          custom-notsigned-prcomment: >-
            Obrigado pela contribuição! Antes do merge, cada autor precisa aceitar o
            [Contrato de Licença de Contribuidor](https://github.com/Discipulu/discipulu/blob/main/CLA.md)
            comentando neste PR exatamente a frase abaixo.
          custom-allsigned-prcomment: Todos os autores aceitaram o CLA.
          create-file-commit-message: "chore(cla): create signatures file"
          signed-commit-message: "chore(cla): $contributorName signed the CLA in #$pullRequestNo"
